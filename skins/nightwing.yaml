name: nightwing
description: "Nightwing — Sovereign On-Premise Agentic AI Workbench (MRPL, SIH 2026)"

# Dark-authored — deep navy/slate with a cyan-teal accent. Distinct from
# Hermes' gold/kawaii default: cooler, quieter, built for an industrial
# on-prem console rather than a chat toy.
colors:
  banner_border: "#334155"
  banner_title: "#22D3EE"
  banner_accent: "#2DD4BF"
  banner_dim: "#475569"
  banner_text: "#E2E8F0"
  ui_accent: "#2DD4BF"
  ui_label: "#67E8F9"
  ui_ok: "#4ade80"
  ui_error: "#f87171"
  ui_warn: "#fbbf24"
  prompt: "#E2E8F0"
  input_rule: "#334155"
  response_border: "#22D3EE"
  status_bar_bg: "#0F172A"
  status_bar_text: "#CBD5E1"
  status_bar_strong: "#22D3EE"
  status_bar_dim: "#475569"
  status_bar_good: "#4ade80"
  status_bar_warn: "#fbbf24"
  status_bar_bad: "#fb923c"
  status_bar_critical: "#f87171"
  session_label: "#67E8F9"
  session_border: "#475569"
  completion_menu_bg: "#0F172A"
  completion_menu_current_bg: "#1E293B"
  selection_bg: "#164E63"
  shell_dollar: "#2DD4BF"
  voice_status_bg: "#0F172A"

# Light overlay — same hue family, darkened/desaturated for white terminal
# backgrounds so contrast stays readable (mirrors the default skin's
# light_colors approach).
