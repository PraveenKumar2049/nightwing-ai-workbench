spinner:
  waiting_faces: ["(☾)", "(◐)", "(◓)", "(◑)", "(◒)"]
  thinking_faces: ["(☾)", "(✦)", "(◈)", "(✦)"]
  thinking_verbs:
    - "reasoning"
    - "checking the manuals"
    - "running the numbers"
    - "drafting"
    - "cross-referencing"
    - "verifying"
  wings:
    - ["⟪☾", "☾⟫"]
    - ["⟪✦", "✦⟫"]
    - ["⟪◈", "◈⟫"]

branding:
  agent_name: "Nightwing"
  org_name: "MRPL"
  working_icon: "☾"
  welcome: "Nightwing — sovereign, on-premise agentic AI. Fully offline, zero external network calls. Type your message or /help for commands."
  goodbye: "Nightwing signing off. ☾"
  response_label: " ☾ Nightwing "
  prompt_symbol: "❯"
  help_header: "☾ Nightwing — Available Commands"

tool_prefix: "┊"

